  <rect width="540" height="650" rx="18" fill="#1e292b" stroke="#9eb69c" stroke-opacity=".6"/>
  <text x="270" y="29" fill="#e9e0bf" text-anchor="middle" font-family="CardCinzel" font-size="14" font-weight="700" letter-spacing=".6">HALO · PALETTE COMPARISON</text>
