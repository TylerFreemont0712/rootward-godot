<svg xmlns="http://www.w3.org/2000/svg" width="164" height="232" viewBox="0 0 164 232" role="img" aria-labelledby="title desc">
  <title id="title">Console card concept — import copy</title>
  <desc id="desc">A 164 by 232 portrait card with framed art, separate import and strike-hook labels, and a prominent constant-time badge.</desc>
  <defs>
    <linearGradient id="shell" x2=".9" y2="1"><stop stop-color="#42304d"/><stop offset=".47" stop-color="#211d2c"/><stop offset="1" stop-color="#121e26"/></linearGradient>
    <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffe4a2"/><stop offset=".5" stop-color="#b77c3b"/><stop offset="1" stop-color="#64432f"/></linearGradient>
    <linearGradient id="teal" x2="0" y2="1"><stop stop-color="#173a3a"/><stop offset="1" stop-color="#112527"/></linearGradient>
    <radialGradient id="art"><stop stop-color="#62477c"/><stop offset="1" stop-color="#211b2c"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="162" height="230" rx="13" fill="url(#shell)" stroke="url(#gold)" stroke-width="2"/>
  <rect x="5" y="5" width="154" height="222" rx="10" fill="none" stroke="#f5d9a044"/>
  <path d="M12 33h140M12 201h140" stroke="#d5ac7144"/>
  <circle cx="22" cy="20" r="13" fill="#2b1d1b" stroke="url(#gold)" stroke-width="2"/>
  <text x="22" y="25" fill="#ffe5a6" text-anchor="middle" font-family="DejaVu Sans" font-size="14" font-weight="700">1</text>
  <text x="149" y="18" fill="#d7c1e9" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="6.5" letter-spacing=".7">MERGER</text>
  <text x="149" y="27" fill="#9e90ac" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="5.5" letter-spacing=".5">ALGORITHM</text>
  <text x="82" y="53" fill="#fff2dc" text-anchor="middle" font-family="DejaVu Sans" font-size="14" font-weight="700">import copy</text>
  <rect x="13" y="61" width="138" height="77" rx="6" fill="url(#art)" stroke="#bc9b754d"/>
  <path d="M17 68v-3h3M147 68v-3h-3M17 131v3h3M147 131v3h-3" fill="none" stroke="#f7d79a" stroke-opacity=".64"/>
  <image href="../../../game/assets/shardrun/card-import-copy.png" x="45" y="62" width="74" height="74" preserveAspectRatio="xMidYMid meet"/>
  <rect x="13" y="143" width="62" height="20" rx="3" fill="#493653" stroke="#bd91d0"/>
  <text x="44" y="156.5" fill="#f4dcff" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="9" font-weight="700" letter-spacing=".4">IMPORT</text>
  <text x="149" y="151" fill="#b9a5ca" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="5.8" letter-spacing=".35">HOOK</text>
  <text x="149" y="160" fill="#ead7f5" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="7.2" font-weight="700">BEFORE STRIKE</text>
  <rect x="13" y="168" width="138" height="31" rx="4" fill="url(#teal)" stroke="#4a9d8d"/>
  <path d="M17 173v21" stroke="#89e6d3" stroke-width="2"/>
  <text x="30" y="191" fill="#8de8d5" font-family="DejaVu Sans" font-size="21" font-weight="700">O(1)</text>
  <text x="143" y="187" fill="#c1eee4" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="8.5" font-weight="700" letter-spacing=".55">CONSTANT</text>
  <text x="82" y="214" fill="#ddd1e6" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="7.1" letter-spacing=".15">COPY LAST ATTACK</text>
  <text x="82" y="223" fill="#ad9eb9" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="6.5" letter-spacing=".4">HALF POWER</text>
</svg>
