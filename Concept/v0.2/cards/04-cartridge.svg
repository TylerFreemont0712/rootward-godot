<svg xmlns="http://www.w3.org/2000/svg" width="224" height="184" viewBox="0 0 224 184" role="img" aria-labelledby="title desc">
  <title id="title">Wide cartridge card concept — import copy</title>
  <desc id="desc">A 224 by 184 landscape card with full card art in a dedicated cartridge bay and readable metadata beside it.</desc>
  <defs>
    <linearGradient id="shell" x2="1" y2=".9"><stop stop-color="#44314d"/><stop offset=".48" stop-color="#201d29"/><stop offset="1" stop-color="#102a2b"/></linearGradient>
    <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffdfa0"/><stop offset=".5" stop-color="#c18a4c"/><stop offset="1" stop-color="#67472d"/></linearGradient>
    <linearGradient id="teal" x2="1" y2="0"><stop stop-color="#14312f"/><stop offset="1" stop-color="#1b4541"/></linearGradient>
    <radialGradient id="art"><stop stop-color="#74528b"/><stop offset="1" stop-color="#201c29"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="222" height="182" rx="15" fill="url(#shell)" stroke="url(#gold)" stroke-width="2"/>
  <rect x="6" y="6" width="212" height="172" rx="11" fill="none" stroke="#f2d99d40"/>
  <rect x="11" y="11" width="74" height="134" rx="8" fill="#171621" stroke="#ba986b"/>
  <rect x="15" y="15" width="66" height="126" rx="6" fill="url(#art)" stroke="#dfc19144"/>
  <path d="M20 26v-5h5M76 26v-5h-5M20 130v5h5M76 130v5h-5" fill="none" stroke="#f2d89a" stroke-opacity=".7"/>
  <image href="../../../game/assets/shardrun/card-import-copy.png" x="15" y="39" width="66" height="66" preserveAspectRatio="xMidYMid meet"/>
  <circle cx="29" cy="29" r="11" fill="#30201b" stroke="url(#gold)" stroke-width="1.7"/>
  <text x="29" y="33" fill="#ffdfa0" text-anchor="middle" font-family="DejaVu Sans" font-size="11" font-weight="700">1</text>
  <text x="92" y="22" fill="#c3b2d2" font-family="DejaVu Sans Mono, monospace" font-size="7" letter-spacing=".65">DIVIDE &amp; CONQUER</text>
  <text x="92" y="44" fill="#fff1dc" font-family="DejaVu Sans" font-size="15" font-weight="700">import copy</text>
  <rect x="92" y="53" width="55" height="18" rx="3" fill="#493653" stroke="#bd91d0"/>
  <text x="119.5" y="65.5" fill="#f4dcff" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="8.5" font-weight="700" letter-spacing=".3">IMPORT</text>
  <text x="215" y="60" fill="#a99bb7" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="5.8" letter-spacing=".45">HOOK</text>
  <text x="215" y="69" fill="#e9d7f4" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="7.4" font-weight="700" letter-spacing=".15">BEFORE STRIKE</text>
  <rect x="92" y="78" width="123" height="36" rx="4" fill="url(#teal)" stroke="#57a493"/>
  <path d="M97 83v26" stroke="#95ecdb" stroke-width="2"/>
  <text x="105" y="104" fill="#96eddc" font-family="DejaVu Sans" font-size="23" font-weight="700">O(1)</text>
  <text x="206" y="100" fill="#d6f1e8" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="8.3" font-weight="700" letter-spacing=".25">CONSTANT</text>
  <path d="M11 153h202" stroke="#d9bb8160"/>
  <text x="112" y="167" fill="#e1d5e8" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="7.5" letter-spacing=".2">COPY LAST ATTACK · HALF POWER</text>
  <text x="112" y="176" fill="#988aa4" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="6" letter-spacing=".65">IMPORT ROUTINE</text>
</svg>
