<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="t d">
  <title id="t">Fight hand size and hover study</title>
  <desc id="d">A static study of 190 by 266 Rootglass-style cards resting 35 pixels below the viewport edge and one hovered card raised and enlarged for readability.</desc>
  <style>@font-face{font-family:CardCinzel;src:url("../../../game/ui/fonts/cinzel.ttf") format("truetype");font-weight:100 900}</style>
  <defs>
    <linearGradient id="background" x2="0" y2="1"><stop stop-color="#222332"/><stop offset="1" stop-color="#11161f"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#282838"/><stop offset="1" stop-color="#1a2029"/></linearGradient>
    <linearGradient id="card-body" x2=".9" y2="1"><stop stop-color="#2a403d"/><stop offset=".42" stop-color="#1d2c30"/><stop offset="1" stop-color="#20202d"/></linearGradient>
    <linearGradient id="card-gold" x2="0" y2="1"><stop stop-color="#f3e4b4"/><stop offset=".3" stop-color="#98b9a0"/><stop offset=".6" stop-color="#637d75"/><stop offset=".82" stop-color="#d9b978"/><stop offset="1" stop-color="#637970"/></linearGradient>
    <radialGradient id="card-well"><stop stop-color="#4b4652"/><stop offset=".77" stop-color="#26343a"/><stop offset="1" stop-color="#192529"/></radialGradient>
    <linearGradient id="card-paper" x2=".2" y2="1"><stop stop-color="#dde0bd"/><stop offset="1" stop-color="#a9baa0"/></linearGradient>
    <clipPath id="rest"><rect x="32" y="113" width="500" height="255" rx="12"/></clipPath>
    <clipPath id="neighbors"><rect x="586" y="113" width="496" height="255" rx="12"/></clipPath>
